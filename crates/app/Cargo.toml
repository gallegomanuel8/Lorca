[package]
name = "lorca"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Editor de texto y código, en homenaje a Federico García Lorca"

[dependencies]
anyhow = "1.0.104"
arboard = "3.7.0"
cargo-packager-updater = "0.2.3"
iced = { version = "0.14.0", features = ["advanced", "image", "markdown", "smol", "svg"] }
lorca-core = { version = "0.2.0", path = "../core" }
lorca-formats = { version = "0.2.0", path = "../formats" }
lorca-lsp = { version = "0.2.0", path = "../lsp" }
lorca-search = { version = "0.2.0", path = "../search" }
lorca-syntax = { version = "0.2.0", path = "../syntax" }
lorca-workspace = { version = "0.2.0", path = "../workspace" }
notify = "8.2.1"
rfd = "0.17.2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
image = { version = "0.25.10", default-features = false, features = ["png"] }
muda = { version = "0.21.2", default-features = false }
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSEvent", "block2", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSURL", "NSString"] }

[target."cfg(windows)".build-dependencies]
winresource = "0.1.34"

[lints]
workspace = true

# Empaquetado con cargo-packager: `cargo packager --release` desde esta carpeta (o con
# `-p lorca` desde la raíz). Formatos por plataforma: .app/.dmg, .msi/.exe y .deb/AppImage.
[package.metadata.packager]
product-name = "Lorca"
identifier = "io.github.gallegomanuel8.lorca"
category = "DeveloperTool"
before-packaging-command = "cargo build --release -p lorca"
out-dir = "../../target/packages"
icons = [
  "../../assets/icons/png/lorca-32.png",
  "../../assets/icons/png/lorca-128.png",
  "../../assets/icons/png/lorca-256.png",
  "../../assets/icons/png/lorca-512.png",
  "../../assets/icons/lorca.icns",
  "../../assets/icons/lorca.ico",
]
binaries = [{ path = "lorca", main = true }]
# Icono de documento de macOS (CFBundleTypeIconFile en macos/Info.plist): tiene que quedar en
# la raíz de Contents/Resources. cargo-packager no tiene recursos solo para macOS, así que
# también se copia junto al ejecutable en Windows y Linux (no se usa allí).
resources = [
  { src = "../../assets/icons/documento/lorca-documento.icns", target = "lorca-documento.icns" },
]

[package.metadata.packager.macos]
# Firma ad hoc («-»): sella el bundle para que macOS no lo dé por dañado. La release la
# sustituye por el certificado Developer ID si el repositorio tiene los secretos (ver
# release.yml); sin ellos, la primera vez hay que permitir la app en Ajustes → Privacidad.
signing-identity = "-"
# Tipos de archivo que abre (para «Abrir con» y el doble clic en el Finder).
info-plist-path = "macos/Info.plist"
minimum-system-version = "11.0"

[package.metadata.packager.deb]
section = "editors"

# Plantilla propia (ver su cabecera): añade la opción «Abrir con Lorca» del menú contextual.
[package.metadata.packager.nsis]
template = "windows/installer.nsi"
languages = ["Spanish"]

# Paquete .rpm (Fedora, openSUSE…) con cargo-generate-rpm, que cargo-packager no hace:
# `cargo build --release -p lorca && cargo generate-rpm -p crates/app`; salida en
# `target/generate-rpm/` (en CI, `target/packages/`). El `.desktop` se llama como el app_id de la ventana (`main.rs`).
[package.metadata.generate-rpm]
name = "lorca"
summary = "Editor de texto y código, en homenaje a Federico García Lorca"
# winit carga estas bibliotecas en tiempo de ejecución (dlopen), así que rpm no las detecta.
requires = { libxkbcommon = "*", libwayland-client = "*", libwayland-cursor = "*" }
assets = [
  { source = "target/release/lorca", dest = "/usr/bin/lorca", mode = "755" },
  { source = "../../assets/linux/lorca.desktop", dest = "/usr/share/applications/lorca.desktop", mode = "644" },
  { source = "../../assets/icons/png/lorca-32.png", dest = "/usr/share/icons/hicolor/32x32/apps/lorca.png", mode = "644" },
  { source = "../../assets/icons/png/lorca-128.png", dest = "/usr/share/icons/hicolor/128x128/apps/lorca.png", mode = "644" },
  { source = "../../assets/icons/png/lorca-256.png", dest = "/usr/share/icons/hicolor/256x256/apps/lorca.png", mode = "644" },
  { source = "../../assets/icons/png/lorca-512.png", dest = "/usr/share/icons/hicolor/512x512/apps/lorca.png", mode = "644" },
]
