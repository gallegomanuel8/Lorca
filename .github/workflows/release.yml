# Al publicar una etiqueta vX.Y.Z se generan los paquetes de los tres sistemas con
# cargo-packager y se adjuntan a una release (en borrador) de GitHub.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Firma y notarización de macOS con un certificado Developer ID, si el repositorio tiene
  # los secretos (ver README). Sin ellos la app va firmada ad hoc.
  DEVELOPER_ID: ${{ secrets.APPLE_SIGNING_IDENTITY != '' }}
  # Firma de las actualizaciones automáticas: cargo-packager genera junto a cada paquete
  # su `.sig` (y en macOS el `.app.tar.gz` que descarga el actualizador).
  CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY }}
  CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD }}

jobs:
  package:
    name: Paquetes (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            formats: app,dmg
            files: |
              target/packages/*.dmg
              target/packages/*-portable.zip
              target/packages/*.app.tar.gz
              target/packages/*.sig
          - os: windows-latest
            formats: nsis,wix
            files: |
              target/packages/*.exe
              target/packages/*.msi
              target/packages/*.sig
          - os: ubuntu-latest
            formats: deb,appimage
            files: |
              target/packages/*.deb
              target/packages/*.AppImage
              target/packages/*.rpm
              target/packages/*.sig
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Dependencias de Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libfuse2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager
      - name: Empaquetar
        if: runner.os != 'macOS' || env.DEVELOPER_ID != 'true'
        working-directory: crates/app
        run: cargo packager --release --formats ${{ matrix.formats }}
      # cargo-packager importa el certificado (.p12 en base64) en un llavero temporal, firma
      # el .app y el .dmg con la identidad indicada y notariza con el Apple ID.
      - name: Empaquetar, firmar y notarizar (macOS)
        if: runner.os == 'macOS' && env.DEVELOPER_ID == 'true'
        working-directory: crates/app
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          sed -i '' "s|^signing-identity = .*|signing-identity = \"$APPLE_SIGNING_IDENTITY\"|" Cargo.toml
          cargo packager --release --formats ${{ matrix.formats }}
      # Versión portable de macOS: el .app comprimido, para usarlo sin instalar el .dmg.
      # ditto conserva los atributos y enlaces del bundle (zip no siempre lo hace).
      - name: Portable de macOS
        if: runner.os == 'macOS'
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "lorca") | .version')
          ditto -c -k --keepParent target/packages/Lorca.app "target/packages/Lorca_${version}_$(uname -m)-portable.zip"
      # .rpm (Fedora, openSUSE…): cargo-packager no lo genera; lo hace cargo-generate-rpm
      # con el binario ya compilado (configuración en crates/app/Cargo.toml).
      - name: Paquete .rpm
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-generate-rpm --locked
          cargo generate-rpm -p crates/app -o target/packages/
      - uses: actions/upload-artifact@v4
        with:
          name: lorca-${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error
      - name: Adjuntar a la release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: ${{ matrix.files }}

  # Manifiesto de actualizaciones (latest.json) con la dirección y la firma del paquete de
  # cada sistema. Lorca lo pide en releases/latest/download/latest.json, así que solo lo ve
  # cuando la release deja de ser borrador.
  manifest:
    name: Manifiesto de actualizaciones
    needs: package
    if: always() && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
      REPO: ${{ github.repository }}
    steps:
      - name: Firmas de los paquetes
        run: gh release download "$TAG" --repo "$REPO" --pattern '*.sig' --dir sigs
      - name: Crear latest.json
        run: |
          python3 - <<'PY'
          import datetime, json, os
          tag, repo = os.environ["TAG"], os.environ["REPO"]
          version = tag.lstrip("v")
          base = f"https://github.com/{repo}/releases/download/{tag}/"
          platforms = {}
          def add(key, asset, format):
              sig = os.path.join("sigs", asset + ".sig")
              if os.path.exists(sig):
                  with open(sig) as f:
                      platforms[key] = {"url": base + asset, "signature": f.read().strip(), "format": format}
          add("macos-aarch64", "Lorca.app.tar.gz", "app")
          add("windows-x86_64", f"lorca_{version}_x64-setup.exe", "nsis")
          add("linux-x86_64", f"lorca_{version}_x86_64.AppImage", "appimage")
          manifest = {
              "version": version,
              "notes": f"https://github.com/{repo}/releases/tag/{tag}",
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": platforms,
          }
          with open("latest.json", "w") as f:
              json.dump(manifest, f, indent=2)
          print(json.dumps(manifest, indent=2))
          PY
      - name: Adjuntar a la release
        run: gh release upload "$TAG" latest.json --repo "$REPO" --clobber
